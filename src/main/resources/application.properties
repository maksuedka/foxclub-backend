# Подключение к базе данных project_db
spring.datasource.url=jdbc:mysql://localhost:3306/project_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Настройки JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Отключаем LazyInitializationException
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Настройки Jackson для работы с Hibernate
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Чтобы корректно работали русские символы
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Логирование для отладки
logging.level.org.springframework.web=DEBUG
logging.level.by.foxclub=DEBUG

