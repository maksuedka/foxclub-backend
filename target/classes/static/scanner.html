<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер QR-кодов | FoxClub Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --primary-color: #ff8c00;
            --bg-dark: #1a1a1a;
            --card-bg: #242424;
            --text-color: #fff;
            --text-secondary: #999;
            --border-color: #333;
            --success-color: #4CAF50;
            --danger-color: #f44336;
            --warning-color: #ff9800;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 i {
            font-size: 2rem;
        }

        .scanner-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .scanner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            min-height: 400px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--primary-color);
            background: #000;
        }

        #reader video, #reader canvas {
            border-radius: 10px !important;
            width: 100% !important;
            height: auto !important;
        }

        #reader__scan_region {
            background: #000 !important;
            min-height: 300px !important;
        }

        #reader__dashboard_section {
            background: #2a2a2a !important;
            padding: 15px !important;
            border-radius: 8px !important;
            margin-top: 10px !important;
        }

        #reader__dashboard_section button,
        #reader__dashboard_section select {
            background: var(--primary-color) !important;
            color: white !important;
            border: none !important;
            padding: 8px 16px !important;
            border-radius: 4px !important;
            cursor: pointer !important;
            font-weight: 500 !important;
            margin: 5px !important;
        }

        #reader__dashboard_section button:hover {
            background: #e67e00 !important;
        }

        .manual-input {
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .manual-input input {
            flex: 1;
            padding: 12px 15px;
            background: #333;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
        }

        .manual-input input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .manual-input button {
            padding: 12px 25px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .manual-input button:hover {
            background: #e67e00;
            transform: translateY(-2px);
        }

        .result-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-header h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }

        .status-expired {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        .info-card {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .info-card h3 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card h3 i {
            font-size: 1.2rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-color);
            font-weight: 600;
        }

        .days-left {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-align: center;
            margin-top: 20px;
        }

        .days-left small {
            font-size: 1rem;
            color: var(--text-secondary);
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #f44336;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: var(--primary-color);
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-edit {
            background: var(--primary-color);
            color: white;
        }

        .btn-edit:hover {
            background: #e67e00;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3);
        }

        .btn-delete {
            background: transparent;
            color: #ff6b6b;
            border: 2px solid #ff6b6b;
        }

        .btn-delete:hover {
            background: #ff6b6b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-scan-new {
            background: var(--primary-color);
            color: white;
            width: 100%;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-scan-new:hover {
            background: #e67e00;
            transform: translateY(-2px);
        }

        .camera-info {
            text-align: center;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .camera-info i {
            color: var(--primary-color);
            margin-right: 5px;
        }

        .temp-message {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            background: var(--success-color);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }
        .temp-message.error {
            background: var(--danger-color);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="admin-panel.html" class="back-button">
            <i class="fas fa-arrow-left"></i> Вернуться в админ-панель
        </a>

        <h1>
            <i class="fas fa-qrcode"></i>
            Сканер QR-кодов
        </h1>

        <div class="scanner-section">
            <div class="scanner-container">
                <div class="camera-info">
                    <i class="fas fa-camera"></i> Наведите камеру на QR-код
                </div>

                <div id="reader"></div>

                <div class="manual-input">
                    <input type="text" id="manualQrInput" placeholder="Или введите QR-код вручную (USER-33 или FC-21-33)">
                    <button onclick="handleManualInput()">
                        <i class="fas fa-search"></i> Найти
                    </button>
                </div>
            </div>
        </div>

        <div id="resultSection" style="display: none;">
            <div class="result-section">
                <div class="result-header">
                    <h2>Информация</h2>
                    <div id="statusBadge" class="status-badge"></div>
                </div>

                <div id="resultContent"></div>

                <div class="action-buttons" id="actionButtons" style="display: none;">
                    <button class="btn-action btn-edit" onclick="editAbonement()">
                        <i class="fas fa-edit"></i> Редактировать
                    </button>
                    <button class="btn-action btn-delete" onclick="deleteAbonement()">
                        <i class="fas fa-trash"></i> Удалить
                    </button>
                </div>

                <button onclick="restartScanner()" class="back-button btn-scan-new">
                    <i class="fas fa-camera"></i> Сканировать следующий
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="editModal" style="display: none;">
        <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center;">
            <div style="background: var(--card-bg); border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; border: 1px solid var(--border-color);">
                <h2 style="color: var(--primary-color); margin-top: 0; margin-bottom: 20px;">Редактирование абонемента</h2>

                <form id="editForm" onsubmit="return false;">
                    <input type="hidden" id="editId">

                    <div style="margin-bottom: 15px;">
                        <label style="color: var(--text-secondary); display: block; margin-bottom: 5px;">Дата начала</label>
                        <input type="date" id="editStartDate" style="width: 100%; padding: 10px; background: #333; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color);">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="color: var(--text-secondary); display: block; margin-bottom: 5px;">Дата окончания</label>
                        <input type="date" id="editEndDate" style="width: 100%; padding: 10px; background: #333; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color);">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="color: var(--text-secondary); display: block; margin-bottom: 5px;">Цена покупки</label>
                        <input type="number" step="0.01" id="editPrice" style="width: 100%; padding: 10px; background: #333; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color);">
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 25px;">
                        <button type="button" onclick="closeEditModal()" style="flex: 1; padding: 12px; background: transparent; border: 2px solid #666; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 600;">Отмена</button>
                        <button type="button" onclick="saveEdit()" style="flex: 1; padding: 12px; background: var(--primary-color); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: 600;">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ========== ДИНАМИЧЕСКОЕ ОПРЕДЕЛЕНИЕ БАЗОВОГО URL ==========
        function getBaseUrl() {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:8080';
            }
            return `${window.location.protocol}//${window.location.hostname}`;
        }

        const API_BASE_URL = getBaseUrl();
        console.log('Scanner using API base:', API_BASE_URL);

        let html5QrCode = null;
        let currentData = null;
        let currentType = null;

        function showTemporaryMessage(text, type) {
            const existing = document.querySelector('.temp-message');
            if (existing) existing.remove();
            const msg = document.createElement('div');
            msg.className = `temp-message ${type}`;
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 4000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            startScanner();
        });

        function startScanner() {
            const readerElement = document.getElementById('reader');
            if (!readerElement) return;
            readerElement.innerHTML = '';

            try {
                html5QrCode = new Html5Qrcode("reader");

                const config = {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                };

                html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText) => {
                        console.log('Найден QR-код:', decodedText);
                        html5QrCode.stop();
                        handleQrCode(decodedText);
                    },
                    (errorMessage) => {
                        // игнорируем
                    }
                ).catch((error) => {
                    console.error('Ошибка запуска камеры:', error);
                    showCameraError();
                });

            } catch (error) {
                console.error('Критическая ошибка:', error);
                showCameraError();
            }
        }

        function showCameraError() {
            document.getElementById('reader').innerHTML = `
                <div style="padding: 20px; text-align: center; color: #f44336;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 48px; margin-bottom: 15px;"></i>
                    <p>Не удалось получить доступ к камере.</p>
                    <p style="font-size: 14px; color: #999;">Используйте ручной ввод кода</p>
                </div>
            `;
        }

        function handleManualInput() {
            const input = document.getElementById('manualQrInput');
            if (!input) return;
            const value = input.value.trim();
            if (value) {
                handleQrCode(value);
            } else {
                alert('Введите QR-код');
            }
        }

        // ========== ОБРАБОТКА QR-КОДА С АВТОМАТИЧЕСКОЙ АКТИВАЦИЕЙ ==========
        async function handleQrCode(qrData) {
            console.log('Обрабатываем код:', qrData);

            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultContent').innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Загрузка данных...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE_URL}/api/scan/${encodeURIComponent(qrData)}`);
                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }

                let data = await response.json();
                currentData = data;
                currentType = data.type;

                // ===== АВТОМАТИЧЕСКАЯ АКТИВАЦИЯ =====
                if (data.type === 'ABONEMENT' && !data.startDate) {
                    const activateRes = await fetch(`${API_BASE_URL}/api/purchased-abonements/${data.id}/activate`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (activateRes.ok) {
                        showTemporaryMessage('✅ Абонемент активирован!', 'success');

                        // === ПОВТОРНЫЙ ЗАПРОС ПОЛНЫХ ДАННЫХ ===
                        const refreshResponse = await fetch(`${API_BASE_URL}/api/scan/${encodeURIComponent(qrData)}`);
                        if (refreshResponse.ok) {
                            const fullData = await refreshResponse.json();
                            data = fullData;
                            currentData = fullData;
                        } else {
                            console.warn('Не удалось получить полные данные после активации');
                        }
                    } else {
                        const err = await activateRes.text();
                        console.warn('Не удалось активировать абонемент:', err);
                        showTemporaryMessage('⚠️ Не удалось активировать абонемент', 'error');
                    }
                }

                if (data.type === 'USER') {
                    displayUserResult(data);
                } else {
                    displayAbonementResult(data);
                }

            } catch (error) {
                document.getElementById('resultContent').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <p>${error.message}</p>
                    </div>
                `;
                document.getElementById('actionButtons').style.display = 'none';
            }
        }

        // ========== ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ ==========
        function displayUserResult(data) {
            document.getElementById('statusBadge').textContent = `Пользователь ID: ${data.user.id}`;
            document.getElementById('statusBadge').className = 'status-badge status-active';
            document.getElementById('actionButtons').style.display = 'none';

            let abonementsHtml = '';
            data.abonements.forEach(ab => {
                const status = ab.isActive ? '🟢 Активен' : '🔴 Истек';
                abonementsHtml += `
                    <div class="info-card" style="margin-bottom: 15px;">
                        <div class="info-row">
                            <span class="info-label">Абонемент:</span>
                            <span class="info-value">${ab.name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Статус:</span>
                            <span class="info-value" style="color: ${ab.isActive ? '#4CAF50' : '#f44336'};">${status}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Дней осталось:</span>
                            <span class="info-value">${ab.daysLeft}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Действует до:</span>
                            <span class="info-value">${new Date(ab.endDate).toLocaleDateString('ru-RU')}</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('resultContent').innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <h3><i class="fas fa-user"></i> Пользователь</h3>
                        <div class="info-row">
                            <span class="info-label">ID:</span>
                            <span class="info-value">${data.user.id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Имя:</span>
                            <span class="info-value">${data.user.firstName} ${data.user.lastName}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Email:</span>
                            <span class="info-value">${data.user.email}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Клуб:</span>
                            <span class="info-value">${data.user.club || '—'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Всего абонементов:</span>
                            <span class="info-value">${data.totalAbonements}</span>
                        </div>
                    </div>
                </div>

                <h3 style="color: var(--primary-color); margin: 20px 0 15px;">📋 Абонементы пользователя</h3>
                ${abonementsHtml}
            `;
        }

        function displayAbonementResult(data) {
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = data.isActive ? 'Активен' : 'Истек';
            statusBadge.className = `status-badge ${data.isActive ? 'status-active' : 'status-expired'}`;

            document.getElementById('actionButtons').style.display = 'flex';

            document.getElementById('resultContent').innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <h3><i class="fas fa-user"></i> Пользователь</h3>
                        <div class="info-row">
                            <span class="info-label">ID:</span>
                            <span class="info-value">${data.user.id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Имя:</span>
                            <span class="info-value">${data.user.firstName} ${data.user.lastName}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Email:</span>
                            <span class="info-value">${data.user.email}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Клуб:</span>
                            <span class="info-value">${data.user.club || '—'}</span>
                        </div>
                    </div>

                    <div class="info-card">
                        <h3><i class="fas fa-ticket-alt"></i> Абонемент</h3>
                        <div class="info-row">
                            <span class="info-label">ID:</span>
                            <span class="info-value">${data.id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Название:</span>
                            <span class="info-value">${data.abonement.name}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Цена:</span>
                            <span class="info-value">${data.abonement.price} р.</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Куплен за:</span>
                            <span class="info-value">${data.priceAtPurchase} р.</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Длительность:</span>
                            <span class="info-value">${data.abonement.duration} дней</span>
                        </div>
                    </div>

                    <div class="info-card">
                        <h3><i class="fas fa-calendar"></i> Даты</h3>
                        <div class="info-row">
                            <span class="info-label">Дата покупки:</span>
                            <span class="info-value">${new Date(data.purchaseDate).toLocaleDateString('ru-RU')}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Дата начала:</span>
                            <span class="info-value">${new Date(data.startDate).toLocaleDateString('ru-RU')}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Дата окончания:</span>
                            <span class="info-value">${new Date(data.endDate).toLocaleDateString('ru-RU')}</span>
                        </div>
                    </div>
                </div>

                <div class="days-left">
                    ${data.daysLeft} <small>дней осталось</small>
                </div>
            `;
        }

        // ========== РЕДАКТИРОВАНИЕ ==========
        function editAbonement() {
            if (!currentData || currentData.type !== 'ABONEMENT') return;
            document.getElementById('editId').value = currentData.id;
            const startDate = new Date(currentData.startDate);
            const endDate = new Date(currentData.endDate);
            document.getElementById('editStartDate').value = startDate.toISOString().split('T')[0];
            document.getElementById('editEndDate').value = endDate.toISOString().split('T')[0];
            document.getElementById('editPrice').value = currentData.priceAtPurchase;
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const startDate = document.getElementById('editStartDate').value;
            const endDate = document.getElementById('editEndDate').value;
            const price = document.getElementById('editPrice').value;

            if (!startDate || !endDate || !price) {
                alert('Заполните все поля');
                return;
            }

            const updatedData = {
                ...currentData,
                startDate: startDate,
                endDate: endDate,
                priceAtPurchase: parseFloat(price)
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/purchased-abonements/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    alert('✅ Абонемент успешно обновлен');
                    closeEditModal();
                    currentData = updatedData;
                    displayAbonementResult(updatedData);
                } else {
                    const error = await response.text();
                    alert('❌ Ошибка обновления: ' + error);
                }
            } catch (error) {
                alert('❌ Ошибка сети: ' + error.message);
            }
        }

        async function deleteAbonement() {
            if (!currentData || currentData.type !== 'ABONEMENT') return;
            if (!confirm('Вы уверены, что хотите удалить этот абонемент?')) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/purchased-abonements/${currentData.id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert('✅ Абонемент успешно удален');
                    document.getElementById('resultSection').style.display = 'none';
                    document.getElementById('manualQrInput').value = '';
                    currentData = null;
                    startScanner();
                } else {
                    const error = await response.text();
                    alert('❌ Ошибка удаления: ' + error);
                }
            } catch (error) {
                alert('❌ Ошибка сети: ' + error.message);
            }
        }

        function restartScanner() {
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('manualQrInput').value = '';
            currentData = null;
            const readerElement = document.getElementById('reader');
            if (readerElement) readerElement.innerHTML = '';
            startScanner();
        }

        window.handleManualInput = handleManualInput;
        window.editAbonement = editAbonement;
        window.closeEditModal = closeEditModal;
        window.saveEdit = saveEdit;
        window.deleteAbonement = deleteAbonement;
        window.restartScanner = restartScanner;
    </script>
</body>
</html>
